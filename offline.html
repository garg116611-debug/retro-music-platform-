<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0A1F1F" />
    <title>Offline - SwarSmriti</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0A1F1F 0%, #0D3535 50%, #0A1F1F 100%);
            color: #F5F0E6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 24px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #D4A84B, #E8C77B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            color: #C5B99A;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .retry-btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #D4A84B, #B8942F);
            color: #0A1F1F;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 168, 75, 0.3);
        }

        .note {
            margin-top: 32px;
            padding: 16px;
            background: rgba(26, 95, 95, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(212, 168, 75, 0.2);
        }

        .note p {
            font-size: 14px;
            margin-bottom: 0;
        }

        .brand {
            margin-top: 48px;
            font-size: 14px;
            color: #8B9A8B;
        }

        .brand span {
            font-size: 20px;
            margin-right: 8px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>
            It looks like you've lost your internet connection.
            Don't worry — your favorites and playlists are saved locally!
        </p>

        <button class="retry-btn" onclick="window.location.reload()">
            Try Again
        </button>

        <div class="note">
            <p>
                💡 <strong>Tip:</strong> Once you're back online, your listening history
                and preferences will sync automatically.
            </p>
        </div>

        <div class="brand">
            <span>🎵</span>
            SwarSmriti — Echoes of Indian Music Legends
        </div>
    </div>

    <script>
        // Auto-retry when connection is restored
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>

</html>
